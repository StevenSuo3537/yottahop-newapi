services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api-custom:local
    environment:
      SQL_DSN: postgresql://${POSTGRES_USER:-newapi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-newapi}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?Set CRYPTO_SECRET in .env}
      TZ: ${TZ:-UTC}
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: ${NODE_NAME:-new-api-node-1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-none}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-newapi}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-newapi} -d ${POSTGRES_DB:-newapi}
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
        - ping
      interval: 5s
      timeout: 5s
      retries: 12
